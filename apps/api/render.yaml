services:
  - type: web
    name: nexus-core-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PING_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://nexusthecore.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://nexusthecore.com,https://nexus-core-chi.vercel.app
      - key: APP_URL
        value: https://nexusthecore.com
      - key: COOKIE_SAMESITE
        value: none
