# A generic, single database configuration.

[alembic]
# Path to migration scripts
script_location = alembic

# Optional: prepend date/time to migration filenames
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Ensure Alembic can import your app modules
prepend_sys_path = .

# Default encoding
output_encoding = utf-8

# Database connection string
# IMPORTANT: Alembic must use a sync driver (psycopg/psycopg2), not asyncpg
# Reference the environment variable set in your shell or .env
sqlalchemy.url = ${SYNC_DATABASE_URL}

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S